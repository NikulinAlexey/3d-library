<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>3D Model Viewer</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Добавляем favicon чтобы убрать ошибку 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🎮</text></svg>"
    />
  </head>
  <body class="body">
    <canvas data-canvas class="canvas"></canvas>

    <div class="overlay">
      <div class="select">
        <div class="select__container">
          <label class="select__label">📦 3D Модель:</label>
          <select class="select__item" data-model-select>
            <option class="select__option" value="" disabled selected>
              Загрузка моделей ⏳
            </option>
          </select>
        </div>
      </div>
      <div class="loader" data-loader>⏳ Загрузка модели...</div>
      <div class="panel">
        <div class="panel__container">
          <div class="panel__text">
            🖱️ Зажмите ЛКМ и двигайте мышь для вращения модели
          </div>
        </div>
      </div>

      <div class="error-message" data-message style="display: none"></div>
    </div>

    <!-- Импорты через CDN с правильными путями -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>

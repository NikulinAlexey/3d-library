<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Model Viewer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Добавляем favicon чтобы убрать ошибку 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <canvas id="modelCanvas" class="model-canvas"></canvas>
    
    <div class="model-selector-wrapper">
      <div class="model-selector">
        <label>📦 3D Модель:</label>
        <select id="modelSelect">
            <option value="" disabled selected>-- Загрузка моделей... --</option>
        </select>
    </div>
    </div>
    
    <div class="info-panel">
        🖱️ Зажмите ЛКМ и двигайте мышь для вращения модели
    </div>
    
    <div class="error-message" id="errorMsg" style="display: none;"></div>
    
    <!-- Импорты через CDN с правильными путями -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module" src="main.js"></script>
</body>
</html>
